<script>
const payload=JSON.parse(document.getElementById('encrypted-payload').textContent);const form=document.getElementById('unlock-form');const passwordInput=document.getElementById('password');const unlockButton=document.getElementById('unlock');const message=document.getElementById('message');const article=document.getElementById('content');const gate=document.getElementById('gate');function b64ToBytes(value){const bin=atob(value);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i+=1)bytes[i]=bin.charCodeAt(i);return bytes}async function deriveKey(password,salt,iterations){const enc=new TextEncoder();const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt'])}async function decrypt(password){const salt=b64ToBytes(payload.salt);const iv=b64ToBytes(payload.iv);const tag=b64ToBytes(payload.tag);const data=b64ToBytes(payload.data);const combined=new Uint8Array(data.length+tag.length);combined.set(data);combined.set(tag,data.length);const key=await deriveKey(password,salt,payload.iterations);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,combined);return new TextDecoder().decode(plain)}function inline(text){const escaped=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return escaped.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}function renderTable(lines){const rows=lines.map(line=>line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>inline(cell.trim())));const headers=rows[0]||[];const bodyRows=rows.slice(2);return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+bodyRows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function renderMarkdown(md){const lines=md.split(/\r?\n/);const html=[];let paragraph=[];let list=[];let table=[];const flushParagraph=()=>{if(!paragraph.length)return;html.push('<p>'+inline(paragraph.join(' '))+'</p>');paragraph=[]};const flushList=()=>{if(!list.length)return;html.push('<ul>'+list.map(item=>'<li>'+inline(item)+'</li>').join('')+'</ul>');list=[]};const flushTable=()=>{if(!table.length)return;html.push(renderTable(table));table=[]};for(const raw of lines){const line=raw.trimEnd();if(!line.trim()){flushParagraph();flushList();flushTable();continue}if(/^\|.*\|$/.test(line)){flushParagraph();flushList();table.push(line);continue}flushTable();if(line.startsWith('# ')){flushParagraph();flushList();html.push('<h1>'+inline(line.slice(2).trim())+'</h1>');continue}if(line.startsWith('## ')){flushParagraph();flushList();html.push('<h2>'+inline(line.slice(3).trim())+'</h2>');continue}if(line.startsWith('### ')){flushParagraph();flushList();html.push('<h3>'+inline(line.slice(4).trim())+'</h3>');continue}if(/^-\s+/.test(line)){flushParagraph();list.push(line.replace(/^-\s+/,''));continue}paragraph.push(line)}flushParagraph();flushList();flushTable();return html.join('\n')}form.addEventListener('submit',async event=>{event.preventDefault();const password=passwordInput.value;if(!password)return;unlockButton.disabled=true;message.textContent='Decrypting...';message.className='hint';try{const markdown=await decrypt(password);article.innerHTML=renderMarkdown(markdown);article.classList.add('unlocked');gate.style.display='none';document.title=payload.title;window.scrollTo({top:0,behavior:'smooth'})}catch(error){message.textContent='That password did not unlock the profile.';message.className='hint error'}finally{unlockButton.disabled=false}});
</script>
