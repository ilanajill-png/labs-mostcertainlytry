<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Las Jaras Garden Field Checklist Lite</title>
  <meta name="robots" content="noindex, nofollow">
  <script>document.documentElement.classList.add("lj-locked");</script>
  <link rel="stylesheet" href="../assets/las-jaras-gate.css">
  <script src="../assets/las-jaras-gate.js" defer></script>
  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #f7f5ef;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      color: #002f73;
      font-size: 2.2rem;
      line-height: 1;
    }
    h2 {
      margin: 28px 0 10px;
      color: #002f73;
    }
    p {
      color: #5e6675;
    }
    a,
    button {
      color: #0047ab;
      font-weight: 800;
    }
    label {
      display: block;
      margin: 12px 0;
      color: #5e6675;
      font-weight: 800;
    }
    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      border: 1px solid #bdc7d8;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      color: #172033;
      font: inherit;
    }
    textarea {
      min-height: 90px;
    }
    section {
      margin: 16px 0;
      padding: 14px;
      border: 1px solid #d8ddea;
      border-radius: 8px;
      background: #fff;
    }
    .top {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }
    .top a {
      display: inline-block;
      border: 1px solid #d8ddea;
      border-radius: 8px;
      padding: 9px 12px;
      background: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Las Jaras Field Checklist Lite</h1>
    <p>Plain phone-safe version. It does not autosave or export; use screenshots, copy/paste, or the full form when available.</p>
    <div class="top">
      <a href="las-jaras-garden-field-checklist.html">Full form</a>
      <a href="las-jaras-garden-site-plan.html">Site plan</a>
    </div>

    <section>
      <h2>Measurements</h2>
      <label>Front width<input placeholder="75 ft expected"></label>
      <label>Back width<input></label>
      <label>Left side depth<input placeholder="137 ft expected"></label>
      <label>Right side depth<input></label>
      <label>House to left fence<input></label>
      <label>House to right fence<input></label>
      <label>House to back fence<input></label>
      <label>Deck / storage placement notes<textarea></textarea></label>
    </section>

    <section>
      <h2>Photos</h2>
      <label>Front / street edge<input type="file" accept="image/*" capture="environment" multiple></label>
      <label>Back yard wide<input type="file" accept="image/*" capture="environment" multiple></label>
      <label>Left side yard<input type="file" accept="image/*" capture="environment" multiple></label>
      <label>Right side yard<input type="file" accept="image/*" capture="environment" multiple></label>
      <label>Deck / storage cluster<input type="file" accept="image/*" capture="environment" multiple></label>
      <label>Problem areas<input type="file" accept="image/*" capture="environment" multiple></label>
    </section>

    <section>
      <h2>Water</h2>
      <label>Hose bibs and outdoor power<textarea placeholder="Where are they, how far do hoses reach, what needs repair?"></textarea></label>
      <label>Drip candidates<textarea></textarea></label>
      <label>Hand-water only areas<textarea></textarea></label>
    </section>

    <section>
      <h2>Shade + Heat</h2>
      <label>Morning observations<textarea></textarea></label>
      <label>Noon observations<textarea></textarea></label>
      <label>Late afternoon heat<textarea></textarea></label>
      <label>Protected nursery spots<textarea></textarea></label>
    </section>

    <section>
      <h2>Garden Assets + Notes</h2>
      <label>Beds, pots, trellises, soil, mulch, tools<textarea></textarea></label>
      <label>Access, gates, paths, constraints<textarea></textarea></label>
      <label>General notes<textarea></textarea></label>
    </section>
  </main>
</body>
</html>
